[project]
name = "agent-governance-control-plane-api"
version = "0.1.0"
description = "FastAPI backend for the Agent Governance Control Plane."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

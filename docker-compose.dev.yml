services:
  postgres:
    image: postgres:16
    container_name: agcp-local-postgres
    environment:
      POSTGRES_DB: agent_governance_control_plane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agcp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d agent_governance_control_plane",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agcp_postgres_data:

name: Backend quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_governance_control_plane
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_governance_control_plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGCP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_governance_control_plane?connect_timeout=5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync backend dependencies
        run: uv sync

      - name: Run backend tests
        run: uv run pytest

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
